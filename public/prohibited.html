<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlobalRadarPro - Non-Compliant Screener</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #ef4444;
      --border-color: #334155;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 24px;
    }
    .container { max-width: 1600px; margin: 0 auto; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h1 { margin: 0; color: var(--accent-color); font-size: 1.8rem; }

    .nav-btn {
      background-color: #38bdf8;
      color: #000;
      font-weight: 700;
      padding: 10px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .filter-panel {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    input {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 0.95rem;
      width: 300px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.9rem;
    }
    th { background-color: #0f172a; color: var(--accent-color); font-weight: 600; }
    tr:hover { background-color: #26334d; }

    .fail-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      background-color: rgba(239, 68, 68, 0.2);
      color: #ef4444;
    }

    /* Exact Pagination Bar Layout from index.html */
    .pagination-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      background-color: var(--card-bg);
      padding: 12px 20px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }
    .pagination-bar button {
      background-color: #334155;
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
    }
    .pagination-bar button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .pagination-bar button:hover:not(:disabled) {
      background-color: #475569;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-bar">
    <h1>⚠️ Non-Compliant Activity Screener</h1>
    <a href="/index.html" class="nav-btn">📊 Financial Screener</a>
  </div>

  <div class="filter-panel">
    <label for="searchInput" style="font-weight:600; color:#94a3b8; margin-right:10px;">Search Ticker / Company:</label>
    <input type="text" id="searchInput" placeholder="e.g. AAPL, Tech..." oninput="handleSearch()">
  </div>

  <table>
    <thead>
      <tr>
        <th>Sr No.</th>
        <th>Ticker</th>
        <th>Company Name</th>
        <th>Exchange</th>
        <th>Debt / Assets</th>
        <th>Illiquid Assets</th>
        <th>Interest Ratio</th>
        <th>Violation Reason</th>
      </tr>
    </thead>
    <tbody id="prohibitedTableBody">
      <tr><td colspan="8" style="text-align:center;">Loading non-compliant data...</td></tr>
    </tbody>
  </table>

  <!-- Exact Pagination Markup from index.html -->
  <div class="pagination-bar">
    <div id="paginationInfo" style="font-size:0.9rem; color:#94a3b8;">Showing 0-0 of 0 tickers</div>
    <div>
      <button id="prevBtn" onclick="changePage(-1)" disabled>Previous</button>
      <span id="pageIndicator" style="font-size:0.9rem; font-weight:600; margin: 0 8px;">Page 1</span>
      <button id="nextBtn" onclick="changePage(1)" disabled>Next</button>
    </div>
  </div>
</div>

<script>
  let rawData = [];
  let currentPage = 1;
  const pageSize = 50;

  async function fetchProhibitedData() {
    const tbody = document.getElementById("prohibitedTableBody");
    try {
      const response = await fetch('/api/non-compliant-stocks');
      if (!response.ok) throw new Error(`HTTP error ${response.status}`);
      const result = await response.json();
      rawData = result.data || [];
      currentPage = 1;
      renderTable();
    } catch (err) {
      console.error('Error fetching non-compliant data:', err);
      if (tbody) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:#ef4444;">Failed to load non-compliant data: ${err.message}</td></tr>`;
      }
    }
  }

  function handleSearch() {
    currentPage = 1;
    renderTable();
  }

  function changePage(dir) {
    currentPage += dir;
    renderTable();
  }

  function renderTable() {
    const search = document.getElementById('searchInput').value.toLowerCase().trim();
    const tbody = document.getElementById('prohibitedTableBody');

    const filteredData = rawData.filter(stock => {
      if (search && !(stock.ticker || '').toLowerCase().includes(search) && !(stock.name || '').toLowerCase().includes(search)) return false;
      return true;
    });

    // Handle Empty Case (Identical to index.html)
    if (filteredData.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">No matching non-compliant tickers found.</td></tr>';
      document.getElementById("paginationInfo").innerText = "Showing 0 of 0 tickers";
      document.getElementById("pageIndicator").innerText = "Page 1 of 1";
      document.getElementById("prevBtn").disabled = true;
      document.getElementById("nextBtn").disabled = true;
      return;
    }

    // Pagination Slicing (Identical to index.html)
    const totalPages = Math.ceil(filteredData.length / pageSize);
    if (currentPage > totalPages) currentPage = totalPages;
    if (currentPage < 1) currentPage = 1;

    const startIndex = (currentPage - 1) * pageSize;
    const endIndex = Math.min(startIndex + pageSize, filteredData.length);
    const pageItems = filteredData.slice(startIndex, endIndex);

    // Update Pagination Indicators (Identical to index.html)
    document.getElementById("paginationInfo").innerText = `Showing ${startIndex + 1}-${endIndex} of ${filteredData.length} tickers`;
    document.getElementById("pageIndicator").innerText = `Page ${currentPage} of ${totalPages}`;
    document.getElementById("prevBtn").disabled = currentPage === 1;
    document.getElementById("nextBtn").disabled = currentPage === totalPages;

    // Render Table Rows
    tbody.innerHTML = pageItems.map((stock, idx) => {
      const rowNum = startIndex + idx + 1;
      const debtVal = stock.debt_to_assets_pct || stock.debt_pct || '0.00%';
      const illiquidVal = stock.illiquid_assets_pct || stock.illiquid_pct || '0.00%';
      const interestVal = stock.interest_income_pct || stock.interest_pct || '0.00%';
      const reasonVal = stock.reasons || stock.reasons_str || 'Non-compliant';

      return `
        <tr>
          <td><strong>${rowNum}</strong></td>
          <td><strong>${stock.ticker || 'N/A'}</strong></td>
          <td>${stock.name || 'N/A'}</td>
          <td>${stock.exchange || 'N/A'}</td>
          <td>${debtVal}</td>
          <td>${illiquidVal}</td>
          <td>${interestVal}</td>
          <td><span class="fail-badge">${reasonVal}</span></td>
        </tr>
      `;
    }).join('');
  }

  fetchProhibitedData();
</script>

</body>
</html>
