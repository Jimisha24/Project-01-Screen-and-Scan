<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlobalRadarPro - Stock Screener</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --border-color: #334155;
      --pass-color: #22c55e;
      --fail-color: #ef4444;
      --review-color: #f59e0b;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 24px;
    }
    .container { max-width: 1600px; margin: 0 auto; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h1 { margin: 0; color: var(--accent-color); font-size: 1.8rem; }

    .nav-btn {
      background-color: #f59e0b;
      color: #000;
      font-weight: 700;
      padding: 10px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .filter-panel {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      align-items: end;
    }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.85rem; font-weight: 600; color: #94a3b8; }
    input, select {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 0.95rem;
    }
    .action-btns { display: flex; gap: 8px; }
    button {
      background-color: var(--accent-color);
      color: #000;
      font-weight: 600;
      border: none;
      padding: 10px 16px;
      border-radius: 4px;
      cursor: pointer;
    }
    button.export-btn { background-color: #10b981; color: #fff; }
    button:hover { opacity: 0.9; }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: var(--card-bg);
      border-radius: 8px 8px 0 0;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.9rem;
    }
    th { background-color: #0f172a; color: var(--accent-color); font-weight: 600; cursor: pointer; user-select: none; }
    th:hover { background-color: #1e293b; }
    th.no-sort { cursor: default; }
    tr:hover { background-color: #26334d; }

    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .pass { background-color: rgba(34, 197, 94, 0.2); color: var(--pass-color); }
    .fail { background-color: rgba(239, 68, 68, 0.2); color: var(--fail-color); }
    .review { background-color: rgba(245, 158, 11, 0.2); color: var(--review-color); }

    .pagination-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-top: none;
      padding: 12px 20px;
      border-radius: 0 0 8px 8px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-bar">
    <h1>📊 GlobalRadarPro - Stock Financial Screener</h1>
    <a href="/technical.html" class="nav-btn" style="background-color:#10b981; color:#000; margin-right:8px;">🎯 Order Block & FVG Screen</a>
    <a href="/prohibited.html" class="nav-btn">⚠️ View Non-Compliant Activity Screen</a>
  </div>

  <div class="filter-panel">
    <div class="form-group">
      <label for="searchInput">Search Ticker / Company / Sector</label>
      <input type="text" id="searchInput" placeholder="e.g. AAPL, Apple, Tech..." oninput="processData()">
    </div>

    <div class="form-group">
      <label for="maxDebtToAssets">Max Debt / Assets (%)</label>
      <input type="number" id="maxDebtToAssets" value="33" step="1">
    </div>

    <div class="form-group">
      <label for="minIlliquid">Min Illiquid Assets (%)</label>
      <input type="number" id="minIlliquid" value="20" step="1">
    </div>

    <div class="form-group">
      <label for="maxInterest">Max Interest Ratio (%)</label>
      <input type="number" id="maxInterest" value="5" step="0.5">
    </div>

    <div class="form-group">
      <label for="exchangeFilter">Exchange</label>
      <select id="exchangeFilter" onchange="processData()">
        <option value="ALL">All Exchanges</option>
        <option value="NASDAQ">NASDAQ</option>
        <option value="NYSE">NYSE</option>
        <option value="NSE">NSE</option>
        <option value="BSE">BSE</option>
      </select>
    </div>

    <div class="form-group">
      <label for="statusFilter">Status Filter</label>
      <select id="statusFilter" onchange="processData()">
        <option value="ALL">All Stocks</option>
        <option value="PASS">Pass Only</option>
        <option value="FAIL">Fail Only</option>
        <option value="REVIEW">Review Only</option>
      </select>
    </div>

    <div class="form-group action-btns">
      <button onclick="applyFiltersAndResetPage()">Filter</button>
      <button class="export-btn" onclick="exportToCSV()">📥 CSV</button>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th class="no-sort">Sr No.</th>
        <th onclick="sortTable('ticker')">Ticker <span id="sort-ticker">↕</span></th>
        <th onclick="sortTable('name')">Company Name <span id="sort-name">↕</span></th>
        <th onclick="sortTable('exchange')">Exchange <span id="sort-exchange">↕</span></th>
        <th onclick="sortTable('sector')">Sector <span id="sort-sector">↕</span></th>
        <th onclick="sortTable('price')">Price ($) <span id="sort-price">↕</span></th>
        <th onclick="sortTable('market_cap')">Market Cap <span id="sort-market_cap">↕</span></th>
        <th onclick="sortTable('debt_to_assets')">Debt / Assets <span id="sort-debt_to_assets">↕</span></th>
        <th onclick="sortTable('illiquid_assets_ratio')">Illiquid Assets <span id="sort-illiquid_assets_ratio">↕</span></th>
        <th onclick="sortTable('interest_income_ratio')">Interest Ratio <span id="sort-interest_income_ratio">↕</span></th>
        <th onclick="sortTable('status')">Status <span id="sort-status">↕</span></th>
      </tr>
    </thead>
    <tbody id="stockTableBody">
      <tr><td colspan="11" style="text-align:center;">Loading tickers...</td></tr>
    </tbody>
  </table>

  <div class="pagination-bar">
    <div id="paginationInfo" style="font-size:0.9rem; color:#94a3b8;">Showing 0-0 of 0 tickers</div>
    <div>
      <button id="prevBtn" onclick="changePage(-1)" disabled>Previous</button>
      <span id="pageIndicator" style="font-size:0.9rem; font-weight:600; margin: 0 8px;">Page 1</span>
      <button id="nextBtn" onclick="changePage(1)" disabled>Next</button>
    </div>
  </div>
</div>

<script>
  let rawData = [];
  let filteredData = [];
  let currentPage = 1;
  const pageSize = 50;
  let currentSortColumn = null;
  let isAscending = true;

  async function fetchStocks() {
    const tbody = document.getElementById("stockTableBody");
    tbody.innerHTML = '<tr><td colspan="11" style="text-align:center;">Loading tickers...</td></tr>';

    const maxDebt = (parseFloat(document.getElementById("maxDebtToAssets").value) / 100) || 0.33;
    const minIlliquid = (parseFloat(document.getElementById("minIlliquid").value) / 100) || 0.20;
    const maxInterest = (parseFloat(document.getElementById("maxInterest").value) / 100) || 0.05;

    const url = `/api/stocks?maxDebtToAssets=${maxDebt}&minIlliquid=${minIlliquid}&maxInterest=${maxInterest}`;

    try {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`HTTP error ${response.status}`);
      const result = await response.json();
      rawData = result.data || [];
      processData();
    } catch (err) {
      console.error("Error fetching stock data:", err);
      tbody.innerHTML = `<tr><td colspan="11" style="text-align:center; color:#ef4444;">Error loading data from server: ${err.message}. Check backend API logs.</td></tr>`;
    }
  }

  function processData() {
    const search = document.getElementById("searchInput").value.toLowerCase().trim();
    const selectedExchange = document.getElementById("exchangeFilter").value;
    const selectedStatus = document.getElementById("statusFilter").value;

    filteredData = rawData.filter(stock => {
      if (search) {
        const tMatch = (stock.ticker || "").toLowerCase().includes(search);
        const cMatch = (stock.name || stock.company_name || stock.company || "").toLowerCase().includes(search);
        const sMatch = (stock.sector || "").toLowerCase().includes(search);
        if (!tMatch && !cMatch && !sMatch) return false;
      }
      if (selectedExchange !== "ALL" && stock.exchange !== selectedExchange) return false;
      if (selectedStatus !== "ALL" && stock.status !== selectedStatus) return false;

      return true;
    });

    if (currentSortColumn) executeSort();
    renderTable();
  }

  function sortTable(columnKey) {
    if (currentSortColumn === columnKey) { isAscending = !isAscending; } 
    else { currentSortColumn = columnKey; isAscending = true; }

    ["ticker", "name", "exchange", "sector", "price", "market_cap", "debt_to_assets", "illiquid_assets_ratio", "interest_income_ratio", "status"].forEach(k => {
      const el = document.getElementById(`sort-${k}`);
      if (el) el.innerText = "↕";
    });
    const active = document.getElementById(`sort-${columnKey}`);
    if (active) active.innerText = isAscending ? "▲" : "▼";

    executeSort();
    renderTable();
  }

  function executeSort() {
    filteredData.sort((a, b) => {
      let valA = currentSortColumn === "name" ? (a.name || a.company_name || a.company) : a[currentSortColumn];
      let valB = currentSortColumn === "name" ? (b.name || b.company_name || b.company) : b[currentSortColumn];

      if (valA === null || valA === undefined) valA = isAscending ? Infinity : -Infinity;
      if (valB === null || valB === undefined) valB = isAscending ? Infinity : -Infinity;

      if (typeof valA === "string") return isAscending ? valA.localeCompare(valB) : valB.localeCompare(valA);
      return isAscending ? valA - valB : valB - valA;
    });
  }

  function renderTable() {
    const tbody = document.getElementById("stockTableBody");
    if (filteredData.length === 0) {
      tbody.innerHTML = '<tr><td colspan="11" style="text-align:center;">No matching tickers found.</td></tr>';
      document.getElementById("paginationInfo").innerText = "Showing 0 of 0 tickers";
      document.getElementById("prevBtn").disabled = true;
      document.getElementById("nextBtn").disabled = true;
      return;
    }

    const totalPages = Math.ceil(filteredData.length / pageSize);
    if (currentPage > totalPages) currentPage = totalPages;
    if (currentPage < 1) currentPage = 1;

    const startIndex = (currentPage - 1) * pageSize;
    const endIndex = Math.min(startIndex + pageSize, filteredData.length);
    const pageItems = filteredData.slice(startIndex, endIndex);

    tbody.innerHTML = pageItems.map((stock, idx) => {
      const companyName = stock.name || stock.company_name || stock.company || "N/A";
      const statusClass = stock.status === "PASS" ? "pass" : (stock.status === "FAIL" ? "fail" : "review");
      return `
        <tr>
          <td><strong>${startIndex + idx + 1}</strong></td>
          <td><strong>${stock.ticker}</strong></td>
          <td>${companyName}</td>
          <td>${stock.exchange || "N/A"}</td>
          <td>${stock.sector || "Unknown"}</td>
          <td>${stock.price !== null && stock.price !== undefined ? "$" + Number(stock.price).toFixed(2) : "N/A"}</td>
          <td><strong>${stock.market_cap_fmt || "N/A"}</strong></td>
          <td>${stock.debt_to_assets_pct || "N/A"}</td>
          <td>${stock.illiquid_assets_pct || "N/A"}</td>
          <td>${stock.interest_income_pct || "N/A"}</td>
          <td><span class="status-badge ${statusClass}">${stock.status}</span></td>
        </tr>
      `;
    }).join("");

    document.getElementById("paginationInfo").innerText = `Showing ${startIndex + 1}-${endIndex} of ${filteredData.length} tickers`;
    document.getElementById("pageIndicator").innerText = `Page ${currentPage} of ${totalPages}`;
    document.getElementById("prevBtn").disabled = currentPage === 1;
    document.getElementById("nextBtn").disabled = currentPage === totalPages;
  }

  function exportToCSV() {
    if (!filteredData || filteredData.length === 0) return alert("No data available to export.");

    const headers = ["Sr No", "Ticker", "Company Name", "Exchange", "Sector", "Price ($)", "Market Cap", "Debt/Assets (%)", "Illiquid Assets (%)", "Interest Ratio (%)", "Status"];
    const rows = filteredData.map((s, idx) => {
      const companyName = s.name || s.company_name || s.company || "";
      return [
        idx + 1,
        `"${s.ticker}"`,
        `"${companyName}"`,
        `"${s.exchange || ""}"`,
        `"${s.sector || ""}"`,
        s.price || "",
        `"${s.market_cap_fmt || ""}"`,
        `"${s.debt_to_assets_pct || ""}"`,
        `"${s.illiquid_assets_pct || ""}"`,
        `"${s.interest_income_pct || ""}"`,
        s.status
      ];
    });

    const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(r => r.join(","))].join("\n");
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", `financial_screener_export_${new Date().toISOString().slice(0,10)}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  function applyFiltersAndResetPage() { currentPage = 1; fetchStocks(); }
  function changePage(dir) { currentPage += dir; renderTable(); }

  fetchStocks();
</script>

</body>
</html>
